<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Land · Admin</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
    <script>
      ;(function () {
        var id = window.netlifyIdentity
        if (!id) return

        function openFromHash() {
          var hash = window.location.hash || ''
          if (hash.indexOf('invite_token=') !== -1) id.open('signup')
          else if (hash.indexOf('recovery_token=') !== -1) id.open('recovery')
          else if (hash.indexOf('confirmation_token=') !== -1) id.open('login')
        }

        id.on('init', openFromHash)
        if (typeof id.init === 'function') id.init()
        openFromHash()
      })()
    </script>
  </body>
</html>
